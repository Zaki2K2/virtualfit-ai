[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualfit-slm"
version = "0.1.0"
description = "VirtualFit language-only fashion dataset, LoRA training and evaluation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.4,<3", "transformers>=4.45,<6", "peft>=0.13,<1", "accelerate>=1,<2", "safetensors>=0.4"]
qlora = ["bitsandbytes>=0.45"]
dev = ["pytest>=8", "nbformat>=5"]

[tool.setuptools.packages.find]
include = ["virtualfit_slm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
